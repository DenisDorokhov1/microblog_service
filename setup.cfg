[flake8]

format = wemake
show-source = True
statistics = False
doctests = True

max-line-length = 88

exclude =
    .git,
    __pycache__,
    .venv,
    migrations,
    tests/*.py


ignore =
    D100,
    D104,
    WPS305,
    WPS306,
    WPS432, 
    B008,
    WPS110,
    WPS404,
    WPS237,
    WPS520,
    WPS226

[isort]
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
line_length = 88

per-file-ignores =
    tests/*.py: WPS226, WPS432